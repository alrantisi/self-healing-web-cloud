global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 3s
    timeout client  10s
    timeout server  10s
    timeout check   1s

resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 1s

frontend web
    bind *:80
    acl host_kuma hdr(host) -i kuma.kel7.lab kuma.kel7.lab:80
    acl host_dash hdr(host) -i dashboard.kel7.lab dashboard.kel7.lab:80
    use_backend kuma if host_kuma
    use_backend monitor if host_dash
    http-request redirect location /dashboard if host_dash { path / }
    acl is_monitor path_beg /dashboard /api
    use_backend monitor if is_monitor
    default_backend servers

backend servers
    balance roundrobin
    option httpchk GET /health
    default-server inter 2s fall 3 rise 2 resolvers docker init-addr libc,none
    server web1 web1:80 check
    server web2 web2:80 check
    server web3 web3:80 check
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s

backend monitor
    server monitor monitor:8000 resolvers docker init-addr libc,none

backend kuma
    timeout tunnel 1h
    server kuma uptime-kuma:3001 resolvers docker init-addr libc,none
